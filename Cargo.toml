[package]
name = "trfrs"
version = "4.10.0"
edition = "2021"
description = "Tandem Repeats Finder: Rust port of the reference C implementation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/keithyin/trfrs"
readme = "README.md"

[[bin]]
name = "trfrs"
path = "src/main.rs"

[dependencies]
# Command line parsing.  Help/usage text is TRF's own, so clap's help and
# colour features are not needed.
clap = { version = "4.5", default-features = false, features = [
    "std",
    "error-context",
    "suggestions",
] }

# Used only to restore the default SIGPIPE disposition (see `main()`); the
# reference implementation does not ignore SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# The scan is one large, tight numeric loop; cross-crate/whole-program
# optimisation keeps it close to the C reference.
lto = "fat"
codegen-units = 1
